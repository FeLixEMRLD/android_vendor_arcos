name: Build ArcOS V0.1-ALPHA GSI

on:
  workflow_dispatch:

jobs:
  build_gsi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArcOS Vendor Repo
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Android Build & Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs aapt apksigner zip unzip wget curl jq xz-utils
          
      - name: Download Base Android 16 GSI (TrebleDroid AOSP + GApps)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work && cd work
          echo "Fetching latest Android 16 arm64-ab-gapps GSI URL..."
          
          # Query ponces/treble_aosp with GH_TOKEN to avoid rate limits, matching aosp-arm64-ab-gapps-16.0
          DOWNLOAD_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ponces/treble_aosp/releases | jq -r '.[].assets[]? | select(.name | test("^aosp-arm64-ab-gapps-16\\.0-.*\\.img\\.xz$")) | .browser_download_url' | head -n 1)
          
          # Fallback to direct known Android 16 release URL if API ever changes
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "API returned empty, using fallback Android 16 GApps URL..."
            DOWNLOAD_URL="https://github.com/ponces/treble_aosp/releases/download/v2025.06.25/aosp-arm64-ab-gapps-16.0-20250625.img.xz"
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          wget -q --show-progress -O system.img.xz "$DOWNLOAD_URL"
          
          echo "Extracting system.img..."
          unxz -T0 system.img.xz

      - name: Mount and Modify System Image for ArcOS
        run: |
          cd work
          e2fsck -f -y system.img || true
          resize2fs system.img 6G
          e2fsck -E unshare_blocks -f -y system.img || true
          
          mkdir -p mount_point
          sudo mount -o loop,rw system.img mount_point
          
          # 1. Patch existing build.prop values so ro.debuggable=1 and density=462 take priority
          sudo sed -i 's/ro.debuggable=0/ro.debuggable=1/g' mount_point/system/build.prop
          sudo sed -i 's/ro.adb.secure=1/ro.adb.secure=0/g' mount_point/system/build.prop
          sudo sed -i '/ro.sf.lcd_density/d' mount_point/system/build.prop
          sudo bash -c "cat ../config/system.prop >> mount_point/system/build.prop"
          
          # Also set density in product/etc/build.prop so DENSITY_DEVICE_STABLE is 462
          sudo sed -i '/ro.sf.lcd_density/d' mount_point/system/product/etc/build.prop || true
          sudo bash -c "echo 'ro.sf.lcd_density=462' >> mount_point/system/product/etc/build.prop"
          
          # 2. Inject ArcOS Init & UDFPS Hardware Bridge Scripts
          sudo cp ../prebuilt/bin/arcos_init.sh mount_point/system/bin/arcos_init.sh
          sudo cp ../prebuilt/bin/arcos_udfps.sh mount_point/system/bin/arcos_udfps.sh
          sudo chmod 755 mount_point/system/bin/arcos_init.sh mount_point/system/bin/arcos_udfps.sh
          sudo chown 0:2000 mount_point/system/bin/arcos_init.sh mount_point/system/bin/arcos_udfps.sh
          
          # 3. Inject init.arcos.rc into /system/etc/init/
          sudo cp ../prebuilt/etc/init/init.arcos.rc mount_point/system/etc/init/init.arcos.rc
          sudo chmod 644 mount_point/system/etc/init/init.arcos.rc
          sudo chown 0:0 mount_point/system/etc/init/init.arcos.rc

          # 4. Build, Align, Sign, and Inject Emerald Overlay
          aapt package -f -M ../overlay/ArcOSDevicesEmerald/AndroidManifest.xml \
            -S ../overlay/ArcOSDevicesEmerald/res \
            -I /usr/lib/android-sdk/platforms/android-*/android.jar \
            -F ArcOSDevicesEmerald-unaligned.apk
          
          zipalign -v -p 4 ArcOSDevicesEmerald-unaligned.apk ArcOSDevicesEmerald.apk
          
          keytool -genkey -v -keystore arcos.keystore -alias arcos -keyalg RSA -keysize 2048 -validity 10000 -storepass arcos123 -keypass arcos123 -dname "CN=ArcOS, OU=Dev, O=ArcOS, L=PH, S=PH, C=PH"
          apksigner sign --ks arcos.keystore --ks-pass pass:arcos123 --key-pass pass:arcos123 ArcOSDevicesEmerald.apk
          
          sudo mkdir -p mount_point/system/product/overlay/ArcOSDevicesEmerald
          sudo cp ArcOSDevicesEmerald.apk mount_point/system/product/overlay/ArcOSDevicesEmerald/
          sudo chmod 644 mount_point/system/product/overlay/ArcOSDevicesEmerald/ArcOSDevicesEmerald.apk

          # 5. Unmount and shrink image back to minimum size for DSU
          sudo umount mount_point
          e2fsck -f -y system.img || true
          resize2fs -M system.img

      - name: Package for DSU Sideloader
        run: |
          cd work
          zip -r1 ArcOS-V0-ALPHA-arm64-ab-gapps.zip system.img

      - name: Upload ArcOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcOS-V0-ALPHA-DSU
          path: work/ArcOS-V0-ALPHA-arm64-ab-gapps.zip
