name: Build ArcOS V0-ALPHA GSI

on:
  workflow_dispatch:

jobs:
  build_gsi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArcOS Vendor Repo
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Android Build & Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs aapt zip unzip wget curl jq xz-utils

      - name: Download Base Android 16 GSI (TrebleDroid AOSP + GApps)
        run: |
          mkdir -p work && cd work
          echo "Fetching latest Android 16 arm64-ab-gapps GSI URL..."
          
          # Automatically grabs the latest Android 16 AOSP GApps build from ponces/treble_aosp
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/ponces/treble_aosp/releases | jq -r '.[].assets[] | select(.name | test("system-.*arm64-ab-gapps.*\\.img\\.xz$")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Failed to fetch URL automatically!"
            exit 1
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          wget -O system.img.xz "$DOWNLOAD_URL"
          
          echo "Extracting system.img..."
          unxz -T0 system.img.xz

      - name: Mount and Modify System Image for ArcOS
        run: |
          cd work
          # Ensure image is raw ext4, unshare blocks so we can write to it, and expand to 6GB
          e2fsck -f -y system.img || true
          resize2fs system.img 6G
          e2fsck -E unshare_blocks -f -y system.img || true
          
          mkdir -p mount_point
          sudo mount -o loop,rw system.img mount_point
          
          # 1. Inject ArcOS build.prop entries
          sudo bash -c "cat ../config/system.prop >> mount_point/system/build.prop"
          
          # 2. Inject ArcOS First-Boot Density & Init Script
          if [ -f ../prebuilt/bin/arcos_init.sh ]; then
            sudo cp ../prebuilt/bin/arcos_init.sh mount_point/system/bin/arcos_init.sh
            sudo chmod 755 mount_point/system/bin/arcos_init.sh
          fi

          # 3. Build and Inject Emerald Overlay
          aapt package -f -M ../overlay/ArcOSDevicesEmerald/AndroidManifest.xml \
            -S ../overlay/ArcOSDevicesEmerald/res \
            -I /usr/lib/android-sdk/platforms/android-*/android.jar \
            -F ArcOSDevicesEmerald.apk || true
          
          if [ -f ArcOSDevicesEmerald.apk ]; then
            sudo mkdir -p mount_point/system/product/overlay/ArcOSDevicesEmerald
            sudo cp ArcOSDevicesEmerald.apk mount_point/system/product/overlay/ArcOSDevicesEmerald/
            sudo chmod 644 mount_point/system/product/overlay/ArcOSDevicesEmerald/ArcOSDevicesEmerald.apk
          fi

          # 4. Unmount and shrink image back to minimum size for DSU
          sudo umount mount_point
          e2fsck -f -y system.img || true
          resize2fs -M system.img

      - name: Package for DSU Sideloader
        run: |
          cd work
          zip -r1 ArcOS-V0-ALPHA-arm64-ab-gapps.zip system.img

      - name: Upload ArcOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcOS-V0-ALPHA-DSU
          path: work/ArcOS-V0-ALPHA-arm64-ab-gapps.zip
