name: Build ArcOS GSI (Android 16)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-gsi:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ArcOS Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up JDK 21 & Android SDK Build-Tools
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies & Android SDK 34
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils e2fsprogs zip unzip curl jq aapt
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Latest TrebleDroid Android 16 GApps GSI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          cd work
          echo "Querying ponces/treble_aosp releases..."
          DOWNLOAD_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ponces/treble_aosp/releases | \
            jq -r '.[].assets[] | select(.name | test("^aosp-arm64-ab-gapps-16\\.0-.*\\.img\\.xz$")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Could not find Android 16 GApps GSI asset!"
            exit 1
          fi

          echo "Downloading: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o system.img.xz
          echo "Decompressing system.img.xz..."
          xz -d -T0 system.img.xz
          ls -lh system.img

      - name: Build ArcOSSetupWizard (Native SDK 34 System Organ)
        run: |
          export WORKSPACE="$GITHUB_WORKSPACE"
          export ANDROID_JAR="$HOME/android-sdk/platforms/android-34/android.jar"
          export BUILD_TOOLS="$HOME/android-sdk/build-tools/34.0.0"

          mkdir -p "$WORKSPACE/keys"
          curl -sL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.pk8 -o "$WORKSPACE/keys/platform.pk8"
          curl -sL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.x509.pem -o "$WORKSPACE/keys/platform.x509.pem"

          cd "$WORKSPACE/packages/ArcOSSetupWizard"
          rm -rf build
          mkdir -p build/gen build/obj build/apk

          echo "1. Generating R.java with SDK 34..."
          aapt package -f -m -J build/gen \
            --min-sdk-version 34 --target-sdk-version 34 \
            -M AndroidManifest.xml -S res -I "$ANDROID_JAR"

          echo "2. Compiling Java sources..."
          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d build/obj \
            build/gen/com/arcos/setupwizard/R.java \
            src/com/arcos/setupwizard/ArcSetupActivity.java

          echo "3. Running D8 dexer (min-api 34)..."
          "$BUILD_TOOLS/d8" --min-api 34 --lib "$ANDROID_JAR" \
            --output build/apk/ \
            build/obj/com/arcos/setupwizard/*.class

          echo "4. Packaging APK with uncompressed resources.arsc (-0 arsc)..."
          aapt package -f -0 arsc \
            --min-sdk-version 34 --target-sdk-version 34 \
            -M AndroidManifest.xml -S res -I "$ANDROID_JAR" \
            -F build/ArcOSSetupWizard.unaligned.apk
          zip -uj build/ArcOSSetupWizard.unaligned.apk build/apk/classes.dex

          echo "5. Page-aligning APK (4-byte alignment)..."
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/ArcOSSetupWizard.unaligned.apk \
            build/ArcOSSetupWizard.aligned.apk

          echo "6. Signing APK with platform certificate..."
          "$BUILD_TOOLS/apksigner" sign \
            --key "$WORKSPACE/keys/platform.pk8" \
            --cert "$WORKSPACE/keys/platform.x509.pem" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/ArcOSSetupWizard.apk \
            build/ArcOSSetupWizard.aligned.apk

          "$BUILD_TOOLS/apksigner" verify -v build/ArcOSSetupWizard.apk
          ls -lh build/ArcOSSetupWizard.apk

      - name: Mount & Customize ArcOS System Image
        run: |
          export WORKSPACE="$GITHUB_WORKSPACE"
          cd "$WORKSPACE/work"

          echo "Expanding system.img by 1536MB..."
          dd if=/dev/zero bs=1M count=1536 >> system.img
          sudo e2fsck -fy system.img || true
          sudo resize2fs system.img
          sudo e2fsck -fy -E unshare_blocks system.img || true
          sudo e2fsck -fy system.img || true

          export MOUNT_DIR="$WORKSPACE/work/mnt"
          mkdir -p "$MOUNT_DIR"
          sudo mount -o loop,rw system.img "$MOUNT_DIR"

          echo "=== Removing Stock & GApps SetupWizards Across All Partitions ==="
          sudo find "$MOUNT_DIR" -maxdepth 5 -type d \( \
            -iname "*SetupWizard*" -o \
            -iname "Provision" -o \
            -iname "*OneTimeInitializer*" \
          \) -print -exec sudo rm -rf {} + || true

          echo "=== Installing ArcOSSetupWizard as Native System Organ ==="
          sudo mkdir -p "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard"
          sudo cp "$WORKSPACE/packages/ArcOSSetupWizard/build/ArcOSSetupWizard.apk" \
            "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard/ArcOSSetupWizard.apk"
          sudo chmod 0755 "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard"
          sudo chmod 0644 "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard/ArcOSSetupWizard.apk"
          sudo chcon -R u:object_r:system_file:s0 "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard" || true

          sudo mkdir -p "$MOUNT_DIR/system/etc/permissions"
          sudo cp "$WORKSPACE/packages/ArcOSSetupWizard/privapp-permissions-arcos.xml" \
            "$MOUNT_DIR/system/etc/permissions/privapp-permissions-arcos.xml"
          sudo chmod 0644 "$MOUNT_DIR/system/etc/permissions/privapp-permissions-arcos.xml"
          sudo chcon u:object_r:system_file:s0 "$MOUNT_DIR/system/etc/permissions/privapp-permissions-arcos.xml" || true

          echo "=== Installing ArcOS Init Scripts ==="
          if [ -f "$WORKSPACE/prebuilt/bin/arcos_init.sh" ]; then
            sudo cp "$WORKSPACE/prebuilt/bin/arcos_init.sh" "$MOUNT_DIR/system/bin/arcos_init.sh"
            sudo chmod 0755 "$MOUNT_DIR/system/bin/arcos_init.sh"
            sudo chown 0:2000 "$MOUNT_DIR/system/bin/arcos_init.sh"
            sudo chcon u:object_r:system_file:s0 "$MOUNT_DIR/system/bin/arcos_init.sh" || true
          fi

          if [ -f "$WORKSPACE/prebuilt/bin/arcos_udfps.sh" ]; then
            sudo cp "$WORKSPACE/prebuilt/bin/arcos_udfps.sh" "$MOUNT_DIR/system/bin/arcos_udfps.sh"
            sudo chmod 0755 "$MOUNT_DIR/system/bin/arcos_udfps.sh"
            sudo chown 0:2000 "$MOUNT_DIR/system/bin/arcos_udfps.sh"
            sudo chcon u:object_r:system_file:s0 "$MOUNT_DIR/system/bin/arcos_udfps.sh" || true
          fi

          if [ -f "$WORKSPACE/prebuilt/etc/init/init.arcos.rc" ]; then
            sudo cp "$WORKSPACE/prebuilt/etc/init/init.arcos.rc" "$MOUNT_DIR/system/etc/init/init.arcos.rc"
            sudo chmod 0644 "$MOUNT_DIR/system/etc/init/init.arcos.rc"
            sudo chown 0:0 "$MOUNT_DIR/system/etc/init/init.arcos.rc"
            sudo chcon u:object_r:system_file:s0 "$MOUNT_DIR/system/etc/init/init.arcos.rc" || true
          fi

          echo "=== Patching build.prop Files Across All Partitions ==="
          for PROP_FILE in \
            "$MOUNT_DIR/system/build.prop" \
            "$MOUNT_DIR/system/product/etc/build.prop" \
            "$MOUNT_DIR/system/system_ext/etc/build.prop"; do
            if [ -f "$PROP_FILE" ]; then
              echo "Patching $PROP_FILE..."
              sudo sed -i '/ro.sf.lcd_density/d' "$PROP_FILE"
              sudo sed -i '/persist.sys.sf.lcd_density/d' "$PROP_FILE"
              sudo sed -i '/ro.control_privapp_permissions/d' "$PROP_FILE"
              sudo sed -i '/ro.setupwizard.mode/d' "$PROP_FILE"
              sudo sed -i '/ro.adb.secure/d' "$PROP_FILE"
              sudo sed -i '/ro.debuggable/d' "$PROP_FILE"

              cat << 'EOF' | sudo tee -a "$PROP_FILE" > /dev/null

          # ArcOS Core Overrides
          ro.sf.lcd_density=462
          persist.sys.sf.lcd_density=462
          ro.control_privapp_permissions=log
          ro.setupwizard.mode=OPTIONAL
          ro.adb.secure=0
          ro.debuggable=1
          EOF
            fi
          done

          if [ -f "$WORKSPACE/config/system.prop" ]; then
            cat "$WORKSPACE/config/system.prop" | sudo tee -a "$MOUNT_DIR/system/build.prop" > /dev/null
          fi

          sync
          sudo umount "$MOUNT_DIR"

          echo "=== Shrinking & Packaging Final Image ==="
          sudo e2fsck -fy system.img || true
          sudo resize2fs -M system.img
          sudo e2fsck -fy system.img || true

          zip -v9 ArcOS-V0.1-ALPHA-16.0-emerald-DSU.zip system.img
          ls -lh ArcOS-V0.1-ALPHA-16.0-emerald-DSU.zip

      - name: Upload ArcOS DSU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcOS-V0.1-ALPHA-16.0-emerald-DSU
          path: work/ArcOS-V0.1-ALPHA-16.0-emerald-DSU.zip
          retention-days: 7
