name: Build ArcOS GSI (Android 16)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-gsi:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout ArcOS Vendor Repo
        uses: actions/checkout@v4

      - name: Install Required System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            attr \
            e2fsprogs \
            xz-utils \
            curl \
            jq \
            unzip \
            zip \
            openjdk-21-jdk \
            python3 \
            python3-pil

      - name: Setup Android SDK Build-Tools 34
        run: |
          mkdir -p "$HOME/android-sdk/bt_tmp" "$HOME/android-sdk/pf_tmp"
          cd "$HOME/android-sdk"
          curl -sSL https://dl.google.com/android/repository/build-tools_r34-linux.zip -o build-tools.zip
          unzip -q build-tools.zip -d bt_tmp
          mv bt_tmp/* build-tools-34
          curl -sSL https://dl.google.com/android/repository/platform-34-ext7_r02.zip -o platform.zip
          unzip -q platform.zip -d pf_tmp
          mv pf_tmp/* platform-34
          curl -sSL https://raw.githubusercontent.com/LineageOS/android_build/lineage-21.0/target/product/security/platform.pk8 -o platform.pk8
          curl -sSL https://raw.githubusercontent.com/LineageOS/android_build/lineage-21.0/target/product/security/platform.x509.pem -o platform.x509.pem

      - name: Compile ArcOSSetupWizard & Static Bootanimation
        run: |
          BUILD_TOOLS="$HOME/android-sdk/build-tools-34"
          ANDROID_JAR="$HOME/android-sdk/platform-34/android.jar"
          KEYS_DIR="$HOME/android-sdk"
          APP_DIR="$GITHUB_WORKSPACE/packages/ArcOSSetupWizard"
          OUT_DIR="/tmp/arcos_suw_build"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/gen" "$OUT_DIR/obj" "$OUT_DIR/dex"

          "$BUILD_TOOLS/aapt" package -f -m \
            --min-sdk-version 34 \
            --target-sdk-version 34 \
            -J "$OUT_DIR/gen" \
            -M "$APP_DIR/AndroidManifest.xml" \
            -S "$APP_DIR/res" \
            -I "$ANDROID_JAR"

          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d "$OUT_DIR/obj" \
            $(find "$OUT_DIR/gen" "$APP_DIR/src" -name "*.java")

          "$BUILD_TOOLS/d8" \
            --lib "$ANDROID_JAR" \
            --min-api 34 \
            --output "$OUT_DIR/dex" \
            $(find "$OUT_DIR/obj" -name "*.class")

          "$BUILD_TOOLS/aapt" package -f \
            --min-sdk-version 34 \
            --target-sdk-version 34 \
            -0 arsc \
            -M "$APP_DIR/AndroidManifest.xml" \
            -S "$APP_DIR/res" \
            -I "$ANDROID_JAR" \
            -F "$OUT_DIR/ArcOSSetupWizard-unaligned.apk"

          zip -qj "$OUT_DIR/ArcOSSetupWizard-unaligned.apk" "$OUT_DIR/dex/classes.dex"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$OUT_DIR/ArcOSSetupWizard-unaligned.apk" \
            "$OUT_DIR/ArcOSSetupWizard-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --key "$KEYS_DIR/platform.pk8" \
            --cert "$KEYS_DIR/platform.x509.pem" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_DIR/ArcOSSetupWizard.apk" \
            "$OUT_DIR/ArcOSSetupWizard-aligned.apk"

          python3 -c 'import os, zipfile; from PIL import Image, ImageDraw; W, H, S = 1080, 2400, 2; img = Image.new("RGB", (W*S, H*S), (0, 0, 0)); draw = ImageDraw.Draw(img); cx, cy, R, r = (W*S)//2, (H*S)//2, 138*S, 56*S; draw.pieslice([cx-R, cy-R, cx+R, cy+R], start=90, end=360, fill=(255, 255, 255)); scx, scy = cx + R - r, cy + R - r; draw.ellipse([scx-r, scy-r, scx+r, scy+r], fill=(255, 255, 255)); final_img = img.resize((W, H), Image.Resampling.LANCZOS); os.makedirs("/tmp/bootanim/part0", exist_ok=True); final_img.save("/tmp/bootanim/part0/00000.png", "PNG"); final_img.save("/tmp/bootanim/part0/00001.png", "PNG"); open("/tmp/bootanim/desc.txt", "w", newline="\n").write("1080 2400 30\np 0 0 part0\n"); zf = zipfile.ZipFile("/tmp/arcos_suw_build/bootanimation.zip", "w", compression=zipfile.ZIP_STORED); zf.write("/tmp/bootanim/desc.txt", "desc.txt"); zf.write("/tmp/bootanim/part0/00000.png", "part0/00000.png"); zf.write("/tmp/bootanim/part0/00001.png", "part0/00001.png"); zf.close()'

      - name: Download Base Android 16 GSI & Inject ArcOS Organs
        run: |
          mkdir -p /tmp/gsi_work
          cd /tmp/gsi_work

          REL_JSON=$(curl -sSL https://api.github.com/repos/ponces/treble_aosp/releases)
          DL_URL=$(echo "$REL_JSON" | jq -r '.[].assets[] | select(.name | test("^aosp-arm64-ab-gapps-16\\.0-.*\\.img\\.xz$")) | .browser_download_url' | head -n 1)
          echo "Downloading Base GSI: $DL_URL"
          curl -L "$DL_URL" -o system.img.xz
          xz -d system.img.xz

          dd if=/dev/zero bs=1M count=256 >> system.img
          e2fsck -fy system.img || true
          resize2fs system.img
          e2fsck -fy -E unshare_blocks system.img || true

          MOUNT_DIR="/mnt/arcos_system"
          sudo mkdir -p "$MOUNT_DIR"
          sudo mount -o loop,rw system.img "$MOUNT_DIR"

          sudo find "$MOUNT_DIR" -maxdepth 5 -type d \( \
            -iname "*SetupWizard*" -o \
            -iname "Provision" -o \
            -iname "*OneTimeInitializer*" \
          \) -exec sudo rm -rf {} + || true

          sudo mkdir -p "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard"
          sudo cp /tmp/arcos_suw_build/ArcOSSetupWizard.apk "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard/ArcOSSetupWizard.apk"
          sudo chmod 0755 "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard"
          sudo chmod 0644 "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard/ArcOSSetupWizard.apk"
          sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard"
          sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MOUNT_DIR/system/priv-app/ArcOSSetupWizard/ArcOSSetupWizard.apk"

          sudo cp "$GITHUB_WORKSPACE/packages/ArcOSSetupWizard/privapp-permissions-arcos.xml" "$MOUNT_DIR/system/etc/permissions/privapp-permissions-arcos.xml"
          sudo chmod 0644 "$MOUNT_DIR/system/etc/permissions/privapp-permissions-arcos.xml"
          sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MOUNT_DIR/system/etc/permissions/privapp-permissions-arcos.xml"

          for MEDIA_DIR in "$MOUNT_DIR/system/product/media" "$MOUNT_DIR/system/media"; do
            sudo mkdir -p "$MEDIA_DIR"
            sudo chmod 0755 "$MEDIA_DIR"
            sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MEDIA_DIR"
            sudo cp /tmp/arcos_suw_build/bootanimation.zip "$MEDIA_DIR/bootanimation.zip"
            sudo cp /tmp/arcos_suw_build/bootanimation.zip "$MEDIA_DIR/bootanimation-dark.zip"
            sudo chmod 0644 "$MEDIA_DIR/bootanimation.zip" "$MEDIA_DIR/bootanimation-dark.zip"
            sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MEDIA_DIR/bootanimation.zip"
            sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MEDIA_DIR/bootanimation-dark.zip"
          done

          if [ -d "$GITHUB_WORKSPACE/prebuilt/bin" ]; then
            sudo cp "$GITHUB_WORKSPACE/prebuilt/bin/"* "$MOUNT_DIR/system/bin/" || true
            sudo chmod 0755 "$MOUNT_DIR/system/bin/arcos_"* || true
            sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MOUNT_DIR/system/bin/arcos_"* || true
          fi
          if [ -d "$GITHUB_WORKSPACE/prebuilt/etc/init" ]; then
            sudo cp "$GITHUB_WORKSPACE/prebuilt/etc/init/"* "$MOUNT_DIR/system/etc/init/" || true
            sudo chmod 0644 "$MOUNT_DIR/system/etc/init/init.arcos.rc" || true
            sudo setfattr -n security.selinux -v "u:object_r:system_file:s0" "$MOUNT_DIR/system/etc/init/init.arcos.rc" || true
          fi

          for PROP_FILE in \
            "$MOUNT_DIR/system/build.prop" \
            "$MOUNT_DIR/system/product/etc/build.prop" \
            "$MOUNT_DIR/system/system_ext/etc/build.prop"; do
            if [ -f "$PROP_FILE" ]; then
              sudo sed -i '/^ro\.build\.display\.id=/d' "$PROP_FILE"
              sudo sed -i '/^ro\.setupwizard\.mode=/d' "$PROP_FILE"
              sudo sed -i '/^ro\.control_privapp_permissions=/d' "$PROP_FILE"
              sudo sed -i '/^ro\.sf\.lcd_density=/d' "$PROP_FILE"
              sudo sed -i '/^persist\.sys\.sf\.lcd_density=/d' "$PROP_FILE"
              printf "\n" | sudo tee -a "$PROP_FILE" > /dev/null
              cat "$GITHUB_WORKSPACE/config/system.prop" | sudo tee -a "$PROP_FILE" > /dev/null
            fi
          done

          sudo umount "$MOUNT_DIR"
          e2fsck -fy system.img || true
          resize2fs -M system.img
          xz -T0 -1 system.img
          mv system.img.xz "$GITHUB_WORKSPACE/ArcOS-V0-ALPHA-Android16-arm64-ab.img.xz"

      - name: Upload ArcOS GSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcOS-V0-ALPHA-Android16-GSI
          path: ArcOS-V0-ALPHA-Android16-arm64-ab.img.xz
